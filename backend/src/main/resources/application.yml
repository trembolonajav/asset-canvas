spring:
  application:
    name: asset-guardian-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asset_guardian}
    username: ${DB_USERNAME:asset_guardian}
    password: ${DB_PASSWORD:asset_guardian}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost}
  security:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}
    operator-username: ${APP_OPERATOR_USERNAME:operadora}
    operator-password: ${APP_OPERATOR_PASSWORD:operadora123}
